# Demo-Konfiguration für den SYNTHETISCHEN Testdatensatz (gleiche Struktur wie euer Datensatz:
# 25 Personen, 1 Tag, 1 Trial pro Aktivität, Trials in 10-s-Clips zerlegt + Retest-Subset Tag 2).
seed: 42
n_jobs: -1
data:
  manifest: data_synth/manifest_clips.csv   # Clips! (manifest.csv = kontinuierliche Trials)
  cache_dir: cache
  fs: 50.0
  sensors: [S01, S02, S05, S06]
  trim_s: 0.0          # Clips sind bereits ohne Übergänge geschnitten -> nichts abschneiden
  max_gap_s: 0.1
windows:
  length_s: 3.0
  step_s: 1.5
  gap_s: 3.0           # >= 1 Fensterlänge Abstand zwischen Train- und Testdaten
split:
  primary: auto        # -> 'block' (1 Trial pro Person & Aktivität)
  n_blocks: 5
  gap_clips: 0
experiments:
  main_activity: Gehen
  E7_n_permutations: 50
results_dir: results
