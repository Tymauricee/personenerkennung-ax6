name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Abhängigkeiten (ohne Deep-Learning-Backends)
        run: pip install numpy scipy pandas scikit-learn matplotlib pyyaml pytest
      - name: Tests (Leakage-Freiheit der Splits, Features, Loader)
        run: pytest -q tests
