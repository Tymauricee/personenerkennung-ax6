name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pakete installieren
        run: pip install numpy scipy pandas scikit-learn matplotlib pytest
      - name: Tests (Laden, Fenster, Leakage-Freiheit der Splits, Merkmale)
        run: pytest -q
